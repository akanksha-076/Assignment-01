<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Event Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="title">Smart Event Dashboard</h1>
    <div class="container">

      <div class="box">
        <h2>Add New Event</h2>
        <form id="eventForm">
          <div class="form-group">
            <label>Event Title</label>
            <input type="text" id="eventTitle" placeholder="e.g. Team Meeting" required />
          </div>
          <div class="form-group">
            <label>Event Date</label>
            <input type="date" id="eventDate" required />
          </div>
          <div class="form-group">
            <label>Category</label>
            <select id="eventCategory">
              <option value="Conference">Conference</option>
              <option value="Workshop">Workshop</option>
              <option value="Social">Social</option>
              <option value="Webinar">Webinar</option>
              <option value="MeetUp">MeetUp</option>
            </select>
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea rows="3" id="eventDescription" placeholder="Brief description..."></textarea>
          </div>
          <button type="submit">Add Event</button>
        </form>
      </div>

      <div class="box sec">
        <h2>My Events</h2>
        <div class="controls">
          <button id="clearAllBtn">Clear All</button>
          <button id="addSampleBtn">Add Samples</button>
        </div>
        <div id="eventContainer">
          <div class="empty-state">No events yet. Add your first event!</div>
        </div>
      </div>

    </div>

    <div class="box dom-box">
      <h2>DOM Manipulation Demo</h2>
      <div id="key">You pressed: —</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
