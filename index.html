<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASSIGNMENT 01</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="title"> Smart Event Dashboard</h1>
    <div class="container">
      <div class="box">
        <h2>Add New Event</h2>
        <form id="eventForm">
          <div class="form-group">
            <label>Event Title</label>
            <input type="text" id="eventTitle" />
          </div>
          <div class="form-group">
            <label>Event Date</label>
            <input type="date" id="eventDate"/>
          </div>
          <div class="form-group">
            <label>Category</label>
            <select name="" id="eventCategory">
              <option value="">Conference</option>
              <option value="">Workshop</option>
              <option value="">Social</option>
              <option value="">Webinar</option>
              <option value="">MeetUp</option>
            </select>
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea rows="3" id="eventDescription"></textarea>
          </div>

          <button>Add Event</button>
        </form>
      </div>
      <div class="box sec">
        <h2>My Events</h2>

        <div class="controls">
          <button id="clearAllBtn">Clear All Events</button>
          <button id="addSampleBtn">Add Sample Events</button>
        </div>
        <div id="eventContainer">
        <div class="empty-state">No events yet. Add your first event!</div>
        </div>
      </div>
    </div>

    <div class="box dom-box">
      <h2>DOM Manipulation Demo</h2>
      <div id="key">YOU PRESSED:</div>
    </div>
    <script src="script.js"></script>
    
</body>
</html>
